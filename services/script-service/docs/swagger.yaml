basePath: /api/v1
host: localhost:8083
info:
  contact:
    email: support@salesai.com
    name: API Support
  description: Microservice for sales scripts handling and text extraction
  title: SalesAI Script Management Service
  version: "1.0"
paths:
  /scripts:
    post:
      consumes:
      - multipart/form-data
      description: Upload a DOCX or PDF file, extract text, and save metadata
      parameters:
      - description: Script name
        in: formData
        name: name
        required: true
        type: string
      - description: Company ID
        in: formData
        name: company_id
        required: true
        type: string
      - description: Script file (DOCX/PDF)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Upload and parse a sales script
      tags:
      - Scripts
  /scripts/{company_id}:
    get:
      consumes:
      - application/json
      description: Get a list of script metadata for a specific company
      parameters:
      - description: Company ID
        in: path
        name: company_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      summary: List scripts for a company
      tags:
      - Scripts
  /scripts/{id}:
    delete:
      description: Mark a script as inactive
      parameters:
      - description: Script ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Delete a script
      tags:
      - Scripts
swagger: "2.0"
