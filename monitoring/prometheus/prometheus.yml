global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'main-api'
    static_configs:
      - targets: ['main-api:8080']

  - job_name: 'sipuni-listener'
    static_configs:
      - targets: ['sipuni-listener:8081']

  - job_name: 'stt-service'
    static_configs:
      - targets: ['stt-service:8001']

  - job_name: 'ai-analytics'
    static_configs:
      - targets: ['ai-analytics:8001']

  - job_name: 'script-service'
    static_configs:
      - targets: ['script-service:8083']

  - job_name: 'sheets-sync'
    static_configs:
      - targets: ['sheets-sync:8085']

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'bullmq-exporter'
    static_configs:
      - targets: ['bullmq-exporter:3000']
