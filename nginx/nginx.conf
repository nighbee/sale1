events {
    worker_connections 1024;
}

http {
    # Use Docker's internal DNS resolver; re-resolve upstreams every 30s
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    upstream main_api {
        server main-api:8080;
    }

    upstream sipuni_listener {
        server sipuni-listener:8081;
    }

    upstream frontend {
        server frontend:80;
    }

    upstream script_service {
        server script-service:8083;
    }

    upstream sheets_sync {
        server sheets-sync:8085;
    }

    server {
        listen 80;

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Main API
        location /api/v1 {
            proxy_pass http://main_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Scripts
        location /api/v1/scripts {
            proxy_pass http://script_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Webhooks (AmoCRM)
        location /api/v1/webhooks {
            proxy_pass http://sipuni_listener;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Sheets Sync
        location /api/v1/sheets-sync/ {
            proxy_pass http://sheets_sync/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Proxy MinIO under a path so browsers can use a same-origin URL like /minio/<bucket>/...
        # We set the Host header to the internal container name so MinIO signature validation
        # still sees the original host used when presigning (minio:9000).
        location /minio/ {
            proxy_pass http://minio:9000/;
            proxy_set_header Host "minio:9000";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }
    }
}
