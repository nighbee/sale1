events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 80;

        location / {
            set $upstream_frontend "frontend:80";
            proxy_pass http://$upstream_frontend;
        }

        location /api/v1 {
            # Use a runtime-resolved backend name via variable so Docker DNS is re-resolved
            # (avoids the unsupported 'resolve' server param in this nginx build).
            set $backend "main-api:8080";
            proxy_pass http://$backend;
            # Timeouts and retry policy to reduce 502s during transient upstream restarts
            proxy_connect_timeout 5s;
            proxy_send_timeout 5s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout;
        }

        location /api/v1/webhooks {
            set $upstream_sipuni "sipuni-listener:8081";
            proxy_pass http://$upstream_sipuni;
        }

        location /api/v1/sheets-sync/ {
            set $upstream_sheets "sheets-sync:8085";
            # When using variables in proxy_pass, the URI is not modified.
            # We rewrite it before passing to maintain the path stripping behavior.
            rewrite ^/api/v1/sheets-sync/(.*) /$1 break;
            proxy_pass http://$upstream_sheets;
        }

        location /minio/ {
            set $upstream_minio "minio:9000";
            rewrite ^/minio/(.*) /$1 break;
            proxy_pass http://$upstream_minio;
        }

        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK";
        }
    }
}
