services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: salesai
      POSTGRES_USER: salesai_user
      POSTGRES_PASSWORD: strong_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesai_user -d salesai"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sale1-network

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sale1-network

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - sale1-network

  main-api:
    build: ./services/main-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "host=postgres port=5432 user=salesai_user password=strong_password dbname=salesai sslmode=disable"
      JWT_SECRET: "mysecret"
      REDIS_URL: "redis://redis:6379"
      DEFAULT_COMPANY_ID: ${COMPANY_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - sale1-network
    volumes:
      - ./services/main-api/internal/infrastructure/database/migrations:/app/internal/infrastructure/database/migrations:ro
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  sipuni-listener:
    build: ./services/sipuni-listener
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: "host=postgres port=5432 user=salesai_user password=strong_password dbname=salesai sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      SIPUNI_API_KEY: ${SIPUNI_API_KEY}
      COMPANY_ID: ${COMPANY_ID}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      - postgres
      - redis
    networks:
      - sale1-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  script-service:
    build: ./services/script-service
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: "host=postgres port=5432 user=salesai_user password=strong_password dbname=salesai sslmode=disable"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin123"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      - postgres
      - minio
    networks:
      - sale1-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  stt-service:
    build: ./services/stt-service
    environment:
      DATABASE_URL: "host=postgres port=5432 user=salesai_user password=strong_password dbname=salesai sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_AI_MODEL: ${GOOGLE_AI_MODEL}
      GROQ_API_KEY: ${GROQ_API_KEY}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-nova-2}
      STT_PROVIDER: "deepgram"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin123"
      MINIO_SECURE: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      - postgres
      - redis
    networks:
      - sale1-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  ai-analytics:
    build: ./services/ai-analytics
    environment:
      DATABASE_URL: "host=postgres port=5432 user=salesai_user password=strong_password dbname=salesai sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      BLACKBOX_API_KEY: ${BLACKBOX_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_AI_MODEL: ${GOOGLE_AI_MODEL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      - postgres
      - redis
    networks:
      - sale1-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    build: ./services/frontend
    restart: always
    depends_on:
      - main-api
    networks:
      - sale1-network

  sheets-sync:
    build: ./services/sheets-sync
    environment:
      DATABASE_URL: "host=postgres port=5432 user=salesai_user password=strong_password dbname=salesai sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      GOOGLE_SHEETS_ID: ${GOOGLE_SHEETS_ID}
      GOOGLE_SERVICE_ACCOUNT_JSON_FILE: /app/gcp-sa.json
      SYNC_INTERVAL: ${SHEETS_SYNC_INTERVAL:-5m}
      SHEET_NAME: ${SHEET_NAME:-Sheet1}
      COMPANY_ID: ${COMPANY_ID:-}
      RUN_MODE: "api"
      PORT: "8085"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./services/sheets-sync/gcp-sa.json:/app/gcp-sa.json:ro
    ports:
      - "8085:8085"
    depends_on:
      - postgres
      - redis
    networks:
      - sale1-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      main-api:
        condition: service_healthy
      sipuni-listener:
        condition: service_started
      script-service:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - sale1-network

  prometheus:
    image: prom/prometheus:v2.45.0
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    networks:
      - sale1-network

  loki:
    image: grafana/loki:2.9.8
    restart: unless-stopped
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - sale1-network

  promtail:
    image: grafana/promtail:2.9.8
    user: root
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - sale1-network

  grafana:
    image: grafana/grafana:10.0.3
    restart: unless-stopped
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - sale1-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8082:8080"
    networks:
      - sale1-network

  redis-exporter:
    image: oliver006/redis_exporter:v1.52.0
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis:6379
    ports:
      - "9121:9121"
    networks:
      - sale1-network

  bullmq-exporter:
    image: igrek8/bullmq-prometheus:latest
    container_name: bullmq_exporter
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=3000
    networks:
      - sale1-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  loki_data:
  grafana_data:

networks:
  sale1-network:
    driver: bridge
