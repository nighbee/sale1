services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: salesai
      POSTGRES_USER: salesai_user
      POSTGRES_PASSWORD: strong_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2024-01-01T16-36-33Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  main-api:
    build: ./services/main-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "host=postgres port=5432 user=salesai_user password=strong_password dbname=salesai sslmode=disable"
      JWT_SECRET: "mysecret"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      - postgres
      - redis

  sipuni-listener:
    build: ./services/sipuni-listener
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: "host=postgres port=5432 user=salesai_user password=strong_password dbname=salesai sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      SIPUNI_API_KEY: ${SIPUNI_API_KEY}
    depends_on:
      - postgres
      - redis

  script-service:
    build: ./services/script-service
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: "host=postgres port=5432 user=salesai_user password=strong_password dbname=salesai sslmode=disable"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin123"
    depends_on:
      - postgres
      - minio

  stt-service:
    build: ./services/stt-service
    environment:
      DATABASE_URL: "host=postgres port=5432 user=salesai_user password=strong_password dbname=salesai sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      # LOCAL_STT_URL: "http://stt-local:5001"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_AI_MODEL: ${GOOGLE_AI_MODEL}
      STT_PROVIDER: "openai" # or "gemini"
    depends_on:
      - postgres
      - redis
      # - stt-local

  ai-analytics:
    build: ./services/ai-analytics
    environment:
      DATABASE_URL: "host=postgres port=5432 user=salesai_user password=strong_password dbname=salesai sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_AI_MODEL: ${GOOGLE_AI_MODEL}
    depends_on:
      - postgres
      - redis

  # stt-local:
  #   build: ./ai-services/stt-local
  #   ports:
  #     - "5001:5001"

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - main-api
      - sipuni-listener
      - script-service

volumes:
  postgres_data:
  redis_data:
  minio_data:
