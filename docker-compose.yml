services:
  postgres:
    image: postgres:16-alpine
    container_name: sales_ai_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sales_ai_analysis
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sales_ai_redis
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sales_ai_app
    ports: ["3000:3000"]
    env_file: [./backend/.env]
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: sales_ai_analysis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      STT_PROVIDER: local-whisper
      LOCAL_STT_URL: http://stt-local:5001
      OPENAI_API_KEY: "sk-................."
    volumes:
      - ./backend/storage:/app/storage
      - ./backend/secrets/gcp-sa.json:/app/keys/gcp-sa.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: sh -c "npm run migration:run && npm run start:prod"
    restart: unless-stopped

  stt-local:
    build:
      context: ./ai-services/stt-local
      dockerfile: Dockerfile
    ports: ["5001:5001"]
    volumes:
      - ./ai-services/hf-cache:/root/.cache/huggingface
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  postgres_data:
  redis_data:
