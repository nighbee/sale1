services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: salesai
      POSTGRES_USER: salesai_user
      POSTGRES_PASSWORD: strong_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2026-02-07T07-43-34Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  main-api:
    build: ./services/main-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "host=postgres port=5432 user=salesai_user password=strong_password dbname=salesai sslmode=disable"
      JWT_SECRET: "mysecret"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      - postgres
      - redis

  sipuni-listener:
    build: ./services/sipuni-listener
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: "host=postgres port=5432 user=salesai_user password=strong_password dbname=salesai sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      SIPUNI_API_KEY: ${SIPUNI_API_KEY}
    depends_on:
      - postgres
      - redis

  script-service:
    build: ./services/script-service
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: "host=postgres port=5432 user=salesai_user password=strong_password dbname=salesai sslmode=disable"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin123"
    depends_on:
      - postgres
      - minio

  stt-service:
    build: ./services/stt-service
    environment:
      DATABASE_URL: "host=postgres port=5432 user=salesai_user password=strong_password dbname=salesai sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      # LOCAL_STT_URL: "http://stt-local:5001"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_AI_MODEL: ${GOOGLE_AI_MODEL}
      STT_PROVIDER: "openai" # or "gemini"
    depends_on:
      - postgres
      - redis
      # - stt-local

  ai-analytics:
    build: ./services/ai-analytics
    environment:
      DATABASE_URL: "host=postgres port=5432 user=salesai_user password=strong_password dbname=salesai sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_AI_MODEL: ${GOOGLE_AI_MODEL}
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./services/frontend
    restart: always
    depends_on:
      - main-api

  # stt-local:
  #   build: ./ai-services/stt-local
  #   ports:
  #     - "5001:5001"

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - main-api
      - sipuni-listener
      - script-service
      - frontend

  prometheus:
    image: prom/prometheus:v2.45.0
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:2.8.2
    restart: unless-stopped
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:2.8.2
    user: root
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml

  grafana:
    image: grafana/grafana:10.0.3
    restart: unless-stopped
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8082:8080"

  redis-exporter:
    image: oliver006/redis_exporter:v1.52.0
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis:6379
    ports:
      - "9121:9121"

  bullmq-exporter:
    image: felixmosh/bull-exporter:latest
    restart: unless-stopped
    environment:
      - EXPORTER_REDIS_URL=redis://redis:6379
    ports:
      - "9800:9800"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  loki_data:
  grafana_data:
