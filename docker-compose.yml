services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: salesai
      POSTGRES_USER: salesai_user
      POSTGRES_PASSWORD: strong_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesai_user -d salesai"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sale1-network

  redis:
    image: redis:7.2-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-strong_redis_password}
      --rename-command CONFIG ""
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --loglevel verbose
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-strong_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sale1-network

  minio:
    image: minio/minio:latest
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_PRESIGN_ENABLED: "true"
      MINIO_PRESIGN_EXPIRY_SECONDS: "300"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - sale1-network

  # One-shot init task to create buckets and apply CORS policy so browsers can fetch
  # presigned URLs from MinIO (port 9000). This runs the AWS CLI pointing to the
  # MinIO S3 endpoint and uses the credentials defined above.
  minio-init:
    image: amazon/aws-cli:2.14.2
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command: |
      sh -c '
        # wait for MinIO readiness
        #   for i in $$(seq 1 60); do
        #       if curl -fs http://minio:9000/minio/health/ready >/dev/null 2>&1; then
        #             break
        #                 fi
        #                     sleep 1
        #                       done
        #
        #                         # create audio bucket (ignore error if exists)
        #                           aws --endpoint-url http://minio:9000 s3api create-bucket --bucket audio || true
        #
        #                             # apply CORS from file
        #                               aws --endpoint-url http://minio:9000 s3api put-bucket-cors \
        #                                   --bucket audio \
        #                                       --cors-configuration file:///cors.json || true
        #
        #                                         echo "minio init done"
        #                                           '
    volumes:
      - ./minio-cors.json:/cors.json:ro
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
    networks:
      - sale1-network

  # Migration init container - runs migrations before main-api starts
  main-api-migrate:
    build: ./services/main-api
    command: /app/migrate
    environment:
      DATABASE_URL: "host=postgres port=5432 user=salesai_user password=strong_password dbname=salesai sslmode=disable"
      MIGRATIONS_PATH: /app/internal/infrastructure/database/migrations
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sale1-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  main-api:
    build: ./services/main-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "host=postgres port=5432 user=salesai_user password=strong_password dbname=salesai sslmode=disable"
      JWT_SECRET: "mysecret"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-strong_redis_password}@redis:6379"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin123"
      # Enable returning presigned URLs and set a public-facing endpoint reachable from the browser.
      # MINIO_ENDPOINT remains internal (minio:9000) so the service can communicate with MinIO inside the
      # Docker network. MINIO_PUBLIC_ENDPOINT is used to rewrite presigned URLs returned to clients.
      MINIO_PRESIGN_ENABLED: "true"
      MINIO_PRESIGN_EXPIRY_SECONDS: "300"
      MINIO_PUBLIC_ENDPOINT: 157.230.92.4:9000
      MINIO_INTERNAL_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      INTERNAL_SECRET: ${INTERNAL_SECRET:-internal-secret-key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      main-api-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - sale1-network
    volumes:
      - ./services/main-api/internal/infrastructure/database/migrations:/app/internal/infrastructure/database/migrations:ro
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  sipuni-listener:
    build: ./services/sipuni-listener
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: "host=postgres port=5432 user=salesai_user password=strong_password dbname=salesai sslmode=disable"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-strong_redis_password}@redis:6379"
      SIPUNI_API_KEY: ${SIPUNI_API_KEY}
      COMPANY_ID: ${COMPANY_ID}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-internal-secret-key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sale1-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  script-service:
    build: ./services/script-service
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: "host=postgres port=5432 user=salesai_user password=strong_password dbname=salesai sslmode=disable"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin123"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-internal-secret-key}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8083/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sale1-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  stt-service:
    build: ./services/stt-service
    environment:
      DATABASE_URL: "host=postgres port=5432 user=salesai_user password=strong_password dbname=salesai sslmode=disable"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-strong_redis_password}@redis:6379"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_AI_MODEL: ${GOOGLE_AI_MODEL}
      GROQ_API_KEY: ${GROQ_API_KEY}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-nova-2}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      STT_PROVIDER: "elevenlabs"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin123"
      MINIO_SECURE: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-internal-secret-key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sale1-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  ai-analytics:
    build: ./services/ai-analytics
    environment:
      DATABASE_URL: "host=postgres port=5432 user=salesai_user password=strong_password dbname=salesai sslmode=disable"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-strong_redis_password}@redis:6379"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: "gemini-3-flash-preview"
      LLM_PROVIDER: "gemini"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_AI_MODEL: ${GOOGLE_AI_MODEL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-internal-secret-key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sale1-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    build: ./services/frontend
    restart: always
    depends_on:
      main-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sale1-network

  sheets-sync:
    build: ./services/sheets-sync
    environment:
      DATABASE_URL: "host=postgres port=5432 user=salesai_user password=strong_password dbname=salesai sslmode=disable"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-strong_redis_password}@redis:6379"
      GOOGLE_SHEETS_ID: ${GOOGLE_SHEETS_ID}
      SYNC_INTERVAL: ${SHEETS_SYNC_INTERVAL:-5m}
      SHEET_NAME: ${SHEET_NAME:-Sheet1}
      COMPANY_ID: ${COMPANY_ID:-}
      RUN_MODE: "api"
      PORT: "8085"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TEAM_NAME: ${TEAM_NAME:-callteam1}
      MAIN_API_URL: "http://main-api:8080"
      INTERNAL_SECRET: ${INTERNAL_SECRET:-internal-secret-key}
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      main-api:
        condition: service_healthy
    networks:
      - sale1-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      main-api:
        condition: service_healthy
      sipuni-listener:
        condition: service_healthy
      script-service:
        condition: service_healthy
      frontend:
        condition: service_healthy
      sheets-sync:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sale1-network

  prometheus:
    image: prom/prometheus:v2.45.0
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    networks:
      - sale1-network

  loki:
    image: grafana/loki:2.9.8
    restart: unless-stopped
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - sale1-network

  promtail:
    image: grafana/promtail:2.9.8
    user: root
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - sale1-network

  grafana:
    image: grafana/grafana:10.0.3
    restart: unless-stopped
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - sale1-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8082:8080"
    networks:
      - sale1-network

  redis-exporter:
    image: oliver006/redis_exporter:v1.52.0
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-strong_redis_password}
    ports:
      - "9121:9121"
    networks:
      - sale1-network

  bullmq-exporter:
    image: igrek8/bullmq-prometheus:latest
    container_name: bullmq_exporter
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-strong_redis_password}
      - PORT=3000
    networks:
      - sale1-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  loki_data:
  grafana_data:

networks:
  sale1-network:
    driver: bridge
